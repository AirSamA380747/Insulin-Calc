<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insulin Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg1:#0f172a;
    --bg2:#1e293b;
    --bg3:#312e81;

    --glass:rgba(255,255,255,.08);
    --glass-border:rgba(255,255,255,.15);

    --text:#ffffff;
    --muted:#cbd5e1;

    --accent:#3b82f6;
}

.light{
    --bg1:#dbeafe;
    --bg2:#eff6ff;
    --bg3:#ffffff;

    --glass:rgba(255,255,255,.45);
    --glass-border:rgba(15,23,42,.15);

    --text:#0f172a;
    --muted:#475569;

    --accent:#2563eb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    color:var(--text);
    overflow-x:hidden;
}

.background{
    position:fixed;
    inset:0;
    z-index:-1;

    background:linear-gradient(
        -45deg,
        var(--bg1),
        var(--bg2),
        var(--bg3),
        var(--bg2)
    );

    background-size:400% 400%;

    animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    max-width:500px;
    margin:auto;
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.avatar{
    width:56px;
    height:56px;
    border-radius:50%;

    background:var(--glass);
    backdrop-filter:blur(20px);

    border:1px solid var(--glass-border);

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:700;
    cursor:pointer;

    transition:.25s;
}

.avatar:hover{
    transform:scale(1.05);
}

.theme-btn{
    width:56px;
    height:56px;
    border:none;
    border-radius:50%;

    cursor:pointer;

    color:var(--text);

    background:var(--glass);
    backdrop-filter:blur(20px);

    border:1px solid var(--glass-border);

    font-size:20px;
}

.welcome{
    margin-bottom:30px;
}

.welcome small{
    color:var(--muted);
}

.welcome h1{
    margin-top:5px;
    font-size:34px;
}

.glass-card{
    background:var(--glass);

    backdrop-filter:blur(25px);

    border:1px solid var(--glass-border);

    border-radius:24px;

    padding:20px;

    margin-bottom:18px;
}

label{
    display:block;
    color:var(--muted);
    margin-bottom:10px;
}

input{    width: -webkit-fill-available; width: -moz-available; width: fill-available; width: 100%;    max-width: 100%;    border:none;    outline:none;
    display:block;
    box-sizing:border-box;
    padding:14px;
    border-radius:16px;
    background:rgba(255,255,255,.1);
    color:var(--text);
    font-size:18px;
    transition:.25s;    border:1px solid var(--glass-border);}

input:focus{
    transform:scale(1.02);
}

.calculate{
    width:100%;
    border:none;

    border-radius:22px;

    padding:16px;

    background:var(--accent);

    color:white;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;
}

.calculate:hover{
    transform:translateY(-2px);
}

.result{
    text-align:center;
    margin-top:35px;
}

.result p{
    color:var(--muted);
}

.result h2{
    font-size:72px;
    margin-top:10px;
}

.profile{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.25);
    backdrop-filter:blur(30px);

    z-index:1000;

    transform:translateY(100%);
    transition:.4s ease;
    overflow-y:auto;
}

.profile.open{
    transform:translateY(0);
}

.profile-content{
    max-width:600px;
    margin:auto;
    padding:25px;
}

.profile-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.profile-header h2{
    font-size:32px;
}

.profile-actions{
    display:flex;
    gap:10px;
}

.close{
    width:50px;
    height:50px;

    border:none;

    border-radius:50%;

    cursor:pointer;

    background:var(--glass);

    color:var(--text);

    border:1px solid var(--glass-border);

    font-size:22px;
}

.profile-avatar{
    width:100px;
    height:100px;

    margin:20px auto;

    border-radius:50%;

    background:var(--glass);

    border:1px solid var(--glass-border);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;
    font-weight:800;
}

.save{
    width:100%;
    border:none;

    margin-top:20px;

    border-radius:20px;

    padding:16px;

    background:#22c55e;

    color:white;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;
}

.saved{
    background:#16a34a;
}

.section-title{
    margin-bottom:15px;
    font-weight:700;
}

.spacer{
    height:15px;
}

.top-time {
    font-size: 20px;
    font-weight: 700;
    opacity: 0.9;
}

.history-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.btn-danger {
    border: none;
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: white;
    background: #ef4444;
    transition: .2s;
}

.btn-danger:hover {
    opacity: 0.9;
}

.history-list {
    max-height: 280px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 5px;
}

.history-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    padding: 12px;
    border-radius: 14px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.light .history-item {
    background: rgba(0, 0, 0, 0.03);
}

.history-item-main {
    flex: 1;
}

.history-item-top {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 6px;
}

.history-item-details {
    display: flex;
    justify-content: space-between;
    font-weight: 500;
}

.delete-single-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #ef4444;
    font-size: 16px;
    padding: 8px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
}

.delete-single-btn:hover {
    background: rgba(239, 68, 68, 0.15);
}

.history-empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 20px 0;
}

</style>
</head>
<body>

<div class="background"></div>

<div class="container">

    <div class="topbar">

        <div class="avatar" onclick="openProfile()" id="avatar">
            U
        </div>
        
        <div class="top-time" id="homeTime">00:00:00</div>

    </div>

    <div class="welcome">
        <small>Welcome back,</small>
        <h1 id="welcomeName">User</h1>
    </div>

    <div class="glass-card">
        <label>Blood Sugar (mmol/L)</label>
        <input type="number" id="glucose" step="0.1">
    </div>

    <div class="glass-card">
        <label>Carbs (g)</label>
        <input type="number" id="carbs">
    </div>

    <button class="calculate" onclick="calculateDose()">
        Calculate Dose
    </button>

    <div class="result">
        <p>Recommended Dose (U)</p>
        <h2 id="dose">0.0u</h2>
    </div>

</div>

<div class="profile" id="profile">

    <div class="profile-content">

        <div class="profile-header">
            <h2>Profile</h2>
            <div class="profile-actions">
                <button class="theme-btn" onclick="toggleTheme()" style="width:50px; height:50px;">
                    ☀
                </button>
                <button class="close" onclick="closeProfile()">✕</button>
            </div>
        </div>

        <div class="profile-avatar" id="profileAvatar">
            U
        </div>

        <div class="glass-card">

            <div class="section-title">Personal Details</div>

            <label>First Name</label>
            <input type="text" id="firstName">

            <div class="spacer"></div>

            <label>Surname</label>
            <input type="text" id="surname">

            <div class="spacer"></div>

            <label>Date of Birth</label>
            <input type="date" id="dob">

        </div>

        <div class="glass-card">
            <div class="history-header-row">
                <div class="section-title" style="margin-bottom:0;">Calculation History</div>
                <button class="btn-danger" onclick="clearAllHistory()">Clear All</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="glass-card">

            <div class="section-title">Insulin Settings</div>

            <label>ICR (00:00 - 11:30) [g carbs/U]</label>
            <input type="number" id="icrMorning" step="0.1">

            <div class="spacer"></div>

            <label>ICR (11:30 - 17:00) [g carbs/U]</label>
            <input type="number" id="icrAfternoon" step="0.1">

            <div class="spacer"></div>

            <label>ICR (17:00 - 24:00) [g carbs/U]</label>
            <input type="number" id="icrEvening" step="0.1">

            <div class="spacer"></div>

            <label>Target (mmol/L)</label>
            <input type="number" id="target" step="0.1">

            <div class="spacer"></div>

            <label>ISF (mmol/L/U)</label>
            <input type="number" id="isf" step="0.1">

        </div>

        <button class="save" id="saveBtn" onclick="saveSettings()">
            Save Settings
        </button>

    </div>

</div>

<script>

function updateHomeTime(){
    const now = new Date();
    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    const secs = String(now.getSeconds()).padStart(2, '0');
    document.getElementById("homeTime").textContent = `${hrs}:${mins}:${secs}`;
}
setInterval(updateHomeTime, 1000);
updateHomeTime();

function getInitials(){
    const first = localStorage.getItem("firstName") || "";
    const surname = localStorage.getItem("surname") || "";

    return (
        (first[0] || "") +
        (surname[0] || "")
    ).toUpperCase() || "U";
}

function updateProfileDisplay(){

    const first =
        localStorage.getItem("firstName") || "User";

    document.getElementById("welcomeName").textContent = first;

    const initials = getInitials();

    document.getElementById("avatar").textContent =
        initials;

    document.getElementById("profileAvatar").textContent =
        initials;
        
    renderHistory();
}

function openProfile(){
    document.getElementById("profile").classList.add("open");
    renderHistory();
}

function closeProfile(){
    document.getElementById("profile").classList.remove("open");
}

function saveSettings(){

    localStorage.setItem(
        "firstName",
        document.getElementById("firstName").value
    );

    localStorage.setItem(
        "surname",
        document.getElementById("surname").value
    );

    localStorage.setItem(
        "dob",
        document.getElementById("dob").value
    );

    localStorage.setItem(
        "ICR_Morning",
        document.getElementById("icrMorning").value
    );

    localStorage.setItem(
        "ICR_Afternoon",
        document.getElementById("icrAfternoon").value
    );

    localStorage.setItem(
        "ICR_Evening",
        document.getElementById("icrEvening").value
    );

    localStorage.setItem(
        "TARGET",
        document.getElementById("target").value
    );

    localStorage.setItem(
        "ISF",
        document.getElementById("isf").value
    );

    updateProfileDisplay();

    const btn = document.getElementById("saveBtn");

    btn.textContent = "✓ Saved";
    btn.classList.add("saved");

    setTimeout(() => {
        btn.textContent = "Save Settings";
        btn.classList.remove("saved");
    }, 2000);
}

function loadSettings(){

    document.getElementById("firstName").value =
        localStorage.getItem("firstName") || "";

    document.getElementById("surname").value =
        localStorage.getItem("surname") || "";

    document.getElementById("dob").value =
        localStorage.getItem("dob") || "";

    document.getElementById("icrMorning").value =
        localStorage.getItem("ICR_Morning") || 10;

    document.getElementById("icrAfternoon").value =
        localStorage.getItem("ICR_Afternoon") || 10;

    document.getElementById("icrEvening").value =
        localStorage.getItem("ICR_Evening") || 10;

    document.getElementById("target").value =
        localStorage.getItem("TARGET") || 6;

    document.getElementById("isf").value =
        localStorage.getItem("ISF") || 2.5;

    updateProfileDisplay();
}

function animateDose(finalDose){

    let current = 0;

    const step = finalDose / 30;

    const interval = setInterval(() => {

        current += step;

        if(current >= finalDose){
            current = finalDose;
            clearInterval(interval);
        }

        document.getElementById("dose").textContent =
            current.toFixed(1) + "u";

    },10);
}

function saveCalculationToHistory(glucose, carbs, dose) {
    const history = JSON.parse(localStorage.getItem("calc_history") || "[]");
    const now = new Date();
    
    const dateStr = now.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    
    const newLog = {
        id: Date.now() + Math.random().toString(36).substr(2, 5), // unique identifier to target specific items
        date: dateStr,
        time: timeStr,
        glucose: glucose,
        carbs: carbs,
        dose: dose
    };
    
    history.push(newLog);
    localStorage.setItem("calc_history", JSON.stringify(history));
}

function renderHistory() {
    const historyList = document.getElementById("historyList");
    const history = JSON.parse(localStorage.getItem("calc_history") || "[]");
    
    if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">No calculations saved yet</div>';
        return;
    }
    
    let html = "";
    for (let i = history.length - 1; i >= 0; i--) {
        const item = history[i];
        html += `
            <div class="history-item">
                <div class="history-item-main">
                    <div class="history-item-top">
                        <span>${item.date}</span>
                        <span>${item.time}</span>
                    </div>
                    <div class="history-item-details">
                        <span>BG: ${item.glucose} mmol/L</span>
                        <span>Carbs: ${item.carbs}g</span>
                        <strong>Dose: ${item.dose}u</strong>
                    </div>
                </div>
                <button class="delete-single-btn" onclick="deleteHistoryItem('${item.id}')" title="Delete entry">
                    🗑️
                </button>
            </div>
        `;
    }
    historyList.innerHTML = html;
}

function deleteHistoryItem(id) {
    let history = JSON.parse(localStorage.getItem("calc_history") || "[]");
    history = history.filter(item => item.id !== id);
    localStorage.setItem("calc_history", JSON.stringify(history));
    renderHistory();
}

function clearAllHistory() {
    if (confirm("Are you sure you want to clear all history logs?")) {
        localStorage.removeItem("calc_history");
        renderHistory();
    }
}

function calculateDose(){

    const glucose =
        Number(document.getElementById("glucose").value);

    const carbs =
        Number(document.getElementById("carbs").value);

    const now = new Date();
    const currentTimeMinutes = (now.getHours() * 60) + now.getMinutes();

    let ICR = 10;
    
    if (currentTimeMinutes >= 0 && currentTimeMinutes < 690) {
        ICR = Number(localStorage.getItem("ICR_Morning") || 10);
    } else if (currentTimeMinutes >= 690 && currentTimeMinutes < 1020) {
        ICR = Number(localStorage.getItem("ICR_Afternoon") || 10);
    } else {
        ICR = Number(localStorage.getItem("ICR_Evening") || 10);
    }

    const TARGET =
        Number(localStorage.getItem("TARGET") || 6);

    const ISF =
        Number(localStorage.getItem("ISF") || 2.5);

    let dose =
        (carbs / ICR) +
        ((glucose - TARGET) / ISF);

    if(dose < 0) dose = 0;

    const finalDoseFormatted = Number(dose.toFixed(1));
    animateDose(finalDoseFormatted);
    saveCalculationToHistory(glucose, carbs, finalDoseFormatted);
}

function toggleTheme(){

    document.body.classList.toggle("light");

    const mode =
        document.body.classList.contains("light")
        ? "light"
        : "dark";

    localStorage.setItem("theme", mode);
}

function loadTheme(){

    const theme =
        localStorage.getItem("theme");

    if(theme === "light"){
        document.body.classList.add("light");
    }
}

loadTheme();
loadSettings();

</script>

</body>
</html>
